version: '3.8'

services:
  todo-app:
    image: host.docker.internal:5000/todo-app:latest
    container_name: todo-app-container
    ports:
      - "3000:80"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3