version: '3.8'

services:
  todo-app:
    image: host.docker.internal:5000/todo-app:${IMAGE_TAG:-latest}
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      retries: 3

  # GÜNCELLENEN KISIM: Volumes silindi, build eklendi
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: nginx-proxy
    ports:
      - "443:443"
    depends_on:
      todo-app:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro